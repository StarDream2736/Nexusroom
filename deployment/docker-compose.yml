services:
  nexusroom:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: nexusroom-server:latest
    container_name: nexusroom
    ports:
      - "${NEXUSROOM_HTTP_PORT:-8080}:8080"
      - "1935:1935"
      - "3478:3478/udp"
      - "50000-50050:50000-50050/udp"
      - "${NEXUSROOM_TURN_RELAY_PORT_RANGE:-51000-51100}:${NEXUSROOM_TURN_RELAY_PORT_RANGE:-51000-51100}/udp"
      - "51820:51820/udp"
    volumes:
      - ./config/server.yaml:/app/config.yaml:ro
      - ./data:/app/data
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    restart: unless-stopped
